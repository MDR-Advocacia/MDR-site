ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
  AuthType Basic
  AuthName "MDR - Previa privada"
  AuthUserFile /run/mdr-preview.htpasswd
  Require valid-user
  <Files healthz.php>
    Require all granted
  </Files>
</Directory>
<IfModule mpm_prefork_module>
  StartServers 2
  MinSpareServers 2
  MaxSpareServers 3
  MaxRequestWorkers 8
  MaxConnectionsPerChild 500
</IfModule>
<Directory /var/www/html/wp-content/uploads>
  <FilesMatch "\.(php[0-9]?|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>
