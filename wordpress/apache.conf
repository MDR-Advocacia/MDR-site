ServerTokens Prod
ServerSignature Off
<IfModule mpm_prefork_module>
  StartServers 2
  MinSpareServers 2
  MaxSpareServers 3
  MaxRequestWorkers 8
  MaxConnectionsPerChild 500
</IfModule>
<Directory /var/www/html/wp-content/uploads>
  <FilesMatch "\.(php[0-9]?|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>
